<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дата и температура в помещении · ДДТ Бикина</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #153e38;
      overflow-wrap: anywhere;
    }
    main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 28px;
      padding: 12px 16px;
      background: #f3f8f5;
      border-inline-start: 4px solid #337665;
      border-radius: 8px;
    }
    p { margin: 0; }
    time {
      display: block;
      font-size: 21px;
      font-weight: 650;
      line-height: 1.3;
    }
    .temperature {
      font-size: 15px;
      line-height: 1.45;
      color: #324b44;
    }
    .reading { font-weight: 700; white-space: nowrap; }
    @media (max-width: 260px) {
      main { padding: 9px 10px; gap: 5px; }
      time { font-size: 18px; }
      .temperature { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main aria-label="Информация ДДТ Бикина">
    <div>
      <time id="today" hidden></time>
      <noscript>Для показа даты нужен JavaScript.</noscript>
    </div>
    <p class="temperature">Среднесуточная температура в помещении — <span class="reading">+24 °C</span></p>
  </main>
  <script>
    const timeZone = "Asia/Vladivostok";
    const dateLabel = new Intl.DateTimeFormat("ru-RU", {
      timeZone, day: "numeric", month: "long", year: "numeric"
    });
    const isoParts = new Intl.DateTimeFormat("en-GB", {
      timeZone, day: "2-digit", month: "2-digit", year: "numeric"
    });
    const today = document.getElementById("today");
    let refreshTimer;

    function refreshDate() {
      clearTimeout(refreshTimer);
      const now = new Date();
      const parts = Object.fromEntries(
        isoParts.formatToParts(now).map(({ type, value }) => [type, value])
      );
      const isoDate = [parts.year, parts.month, parts.day].join("-");
      if (today.dateTime !== isoDate) {
        today.dateTime = isoDate;
        today.textContent = dateLabel.format(now);
        today.hidden = false;
      }
      // Проверяем на границе минуты, в том числе в 00:00 по Владивостоку.
      refreshTimer = setTimeout(refreshDate, 60000 - (now.getTime() % 60000));
    }

    refreshDate();
    window.addEventListener("pageshow", refreshDate);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshDate();
    });
  </script>
</body>
</html>
